name: CI

# Lint and unit tests only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install harness dev dependencies
        run: npm install --no-save --no-package-lock eslint @eslint/js @stylistic/eslint-plugin globals

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
